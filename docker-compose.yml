services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: spexivix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: spexivix
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - spexivix-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d spexivix"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  spexivix-postgres-data:
